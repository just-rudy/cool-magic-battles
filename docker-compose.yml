services:
  db:
    image: postgres:16-alpine
    container_name: cmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmb
      POSTGRES_PASSWORD: cmb
      POSTGRES_DB: cool_magic_battles
    ports:
      # 5433 — чтобы не конфликтовать с локальным PostgreSQL на 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmb -d cool_magic_battles"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
